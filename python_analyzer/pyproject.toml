[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gsm-gold-python-analyzer"
version = "1.0.0"
description = "Offline MT5 gold EA research analyzer with Chinese reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gsm-gold-analyzer = "gsm_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["gsm_analyzer*"]
